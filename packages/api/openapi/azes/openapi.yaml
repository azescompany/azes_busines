# AZES COMPANY
# File: packages/api/openapi/azes/openapi.yaml
# Author: AZES_COMPANY
# Created: 2026-10-19
# Updated: 2026-10-26
# Purpose: AZES OpenAPI — auth + LMS + tenant + menu RBAC (M1.5)
# Layer: package

openapi: 3.0.3
info:
  title: AZES API
  version: 0.16.0
  description: |
    AZES HTTP API client contract (auth + LMS + tenant + menu RBAC + ERP modules/CRM).
    Runtime behaviour is owned by apps/api (@azes/api-server).
    GET /me is the Admin session bootstrap (nav + permissions).
servers:
  - url: http://127.0.0.1:8787
    description: Local Wrangler Worker
tags:
  - name: auth
    description: Authentication (login / refresh / logout / me)
  - name: courses
    description: Academy LMS catalogue / curriculum / enrollments (read)
  - name: manage
    description: Academy LMS instructor/org write APIs
  - name: quizzes
    description: Quiz attempts and student assignment submissions
  - name: dashboard
    description: Me dashboard, notifications, bookmarks, certificates
  - name: orgs
    description: Organizations, Tracks, memberships and invitations (TAGET M1)
  - name: menus
    description: Admin menu catalog and role↔menu bindings (TAGET M1.5)
paths:
  /api/v1/me:
    get:
      tags: [auth]
      operationId: getApiV1Me
      summary: Current authenticated user (Bearer access JWT)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Missing, invalid, revoked, or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '403':
          description: Account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/categories:
    get:
      tags: [courses]
      operationId: getApiV1Categories
      summary: List course categories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/courses:
    get:
      tags: [courses]
      operationId: getApiV1Courses
      summary: List courses (published; staff also see own drafts)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: q
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            enum: [beginner, intermediate, advanced]
      responses:
        '200':
          description: Paginated courses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/courses/{courseId}/enroll:
    post:
      tags: [courses]
      operationId: postApiV1CoursesCourseIdEnroll
      summary: Enroll in a published course (idempotent; invite needs Track access)
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Enrolled (or existing enrollment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/courses/{courseId}/curriculum:
    get:
      tags: [courses]
      operationId: getApiV1CoursesCourseIdCurriculum
      summary: Course curriculum (modules + lesson summaries)
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Curriculum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/courses/{slug}:
    get:
      tags: [courses]
      operationId: getApiV1CoursesSlug
      summary: Course detail by slug
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Course detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/me/enrollments:
    get:
      tags: [courses]
      operationId: getApiV1MeEnrollments
      summary: Current user enrollments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Enrollment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/me/learning:
    get:
      tags: [courses]
      operationId: getApiV1MeLearning
      summary: My learning — enrollments with progress (Öyrənməm)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Learning list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/courses/{courseId}/progress:
    get:
      tags: [courses]
      operationId: getApiV1CoursesCourseIdProgress
      summary: Course progress for current user
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseProgress'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/lessons/{lessonId}:
    get:
      tags: [courses]
      operationId: getApiV1LessonsLessonId
      summary: Lesson detail (enrollment required)
      security:
        - bearerAuth: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lesson
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonDetail'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/lessons/{lessonId}/complete:
    post:
      tags: [courses]
      operationId: postApiV1LessonsLessonIdComplete
      summary: Mark lesson complete (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonProgress'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/files/{fileId}/content:
    get:
      tags: [courses]
      operationId: getApiV1FilesFileIdContent
      summary: Download file via signed query (exp, uid, sig)
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
        - name: exp
          in: query
          required: true
          schema:
            type: integer
        - name: uid
          in: query
          required: true
          schema:
            type: string
        - name: sig
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/manage/courses:
    post:
      tags: [manage]
      operationId: postApiV1ManageCourses
      summary: Create draft course (instructor/admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageCourseCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/manage/courses/{courseId}:
    patch:
      tags: [manage]
      operationId: patchApiV1ManageCoursesCourseId
      summary: Update course (owner instructor or admin)
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageCoursePatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/manage/courses/{courseId}/modules:
    post:
      tags: [manage]
      operationId: postApiV1ManageCoursesCourseIdModules
      summary: Add module to course
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageModuleCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleCurriculum'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/manage/modules/{moduleId}/lessons:
    post:
      tags: [manage]
      operationId: postApiV1ManageModulesModuleIdLessons
      summary: Add lesson to module
      security:
        - bearerAuth: []
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageLessonCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonSummary'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/manage/courses/{courseId}/publish:
    post:
      tags: [manage]
      operationId: postApiV1ManageCoursesCourseIdPublish
      summary: Publish course (min 1 module + 1 lesson)
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/manage/files:
    post:
      tags: [manage]
      operationId: postApiV1ManageFiles
      summary: Upload course material (R2; mime + 5MB limit)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  description: e.g. course_material, cover
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageFileAsset'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '503':
          description: R2 not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/manage/courses/{courseId}/modules/reorder:
    put:
      tags: [manage]
      operationId: putApiV1ManageCoursesCourseIdModulesReorder
      summary: Reorder modules (full id list)
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageReorderIds'
      responses:
        '200':
          description: Reordered modules
          content:
            application/json:
              schema:
                type: object
                required: [courseId, modules]
                properties:
                  courseId:
                    type: string
                  modules:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModuleCurriculum'

  /api/v1/manage/modules/{moduleId}/lessons/reorder:
    put:
      tags: [manage]
      operationId: putApiV1ManageModulesModuleIdLessonsReorder
      summary: Reorder lessons in a module
      security:
        - bearerAuth: []
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageReorderIds'
      responses:
        '200':
          description: Reordered lessons
          content:
            application/json:
              schema:
                type: object
                required: [moduleId, lessons]
                properties:
                  moduleId:
                    type: string
                  lessons:
                    type: array
                    items:
                      $ref: '#/components/schemas/LessonSummary'

  /api/v1/manage/lessons/{lessonId}/archive:
    post:
      tags: [manage]
      operationId: postApiV1ManageLessonsLessonIdArchive
      summary: Soft-archive lesson (never hard-delete; progress preserved)
      security:
        - bearerAuth: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                type: object
                required: [lesson, hadProgress]
                properties:
                  lesson:
                    $ref: '#/components/schemas/LessonSummary'
                  hadProgress:
                    type: boolean

  /api/v1/manage/modules/{moduleId}/archive:
    post:
      tags: [manage]
      operationId: postApiV1ManageModulesModuleIdArchive
      summary: Soft-archive module and its lessons
      security:
        - bearerAuth: []
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleCurriculum'

  /api/v1/manage/courses/{courseId}/archive:
    post:
      tags: [manage]
      operationId: postApiV1ManageCoursesCourseIdArchive
      summary: Soft-archive course
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'

  /api/v1/manage/courses/{courseId}/quizzes:
    get:
      tags: [manage]
      operationId: getApiV1ManageCoursesCourseIdQuizzes
      summary: List quizzes for course (staff; may include draft)
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Quiz list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSummaryList'
    post:
      tags: [manage]
      operationId: postApiV1ManageCoursesCourseIdQuizzes
      summary: Create draft quiz
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageQuizCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSummary'

  /api/v1/manage/quizzes/{quizId}:
    get:
      tags: [manage]
      operationId: getApiV1ManageQuizzesQuizId
      summary: Quiz detail with correct answers (staff)
      security:
        - bearerAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Staff quiz
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizStaff'

  /api/v1/manage/quizzes/{quizId}/questions:
    post:
      tags: [manage]
      operationId: postApiV1ManageQuizzesQuizIdQuestions
      summary: Add question (correctAnswer stored server-side)
      security:
        - bearerAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageQuestionCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionStaff'

  /api/v1/manage/quizzes/{quizId}/publish:
    post:
      tags: [manage]
      operationId: postApiV1ManageQuizzesQuizIdPublish
      summary: Publish quiz (requires ≥1 question)
      security:
        - bearerAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSummary'

  /api/v1/manage/courses/{courseId}/assignments:
    post:
      tags: [manage]
      operationId: postApiV1ManageCoursesCourseIdAssignments
      summary: Create draft assignment
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageAssignmentCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'

  /api/v1/manage/assignments/{assignmentId}/publish:
    post:
      tags: [manage]
      operationId: postApiV1ManageAssignmentsAssignmentIdPublish
      summary: Publish assignment
      security:
        - bearerAuth: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'

  /api/v1/manage/assignments/{assignmentId}/submissions:
    get:
      tags: [manage]
      operationId: getApiV1ManageAssignmentsAssignmentIdSubmissions
      summary: List submissions for assignment
      security:
        - bearerAuth: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionList'

  /api/v1/manage/submissions/{submissionId}/grade:
    post:
      tags: [manage]
      operationId: postApiV1ManageSubmissionsSubmissionIdGrade
      summary: Grade assignment submission
      security:
        - bearerAuth: []
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeSubmissionBody'
      responses:
        '200':
          description: Graded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'

  /api/v1/courses/{courseId}/quizzes:
    get:
      tags: [quizzes]
      operationId: getApiV1CoursesCourseIdQuizzes
      summary: List published quizzes for enrolled student
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published quizzes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSummaryList'

  /api/v1/quizzes/{quizId}:
    get:
      tags: [quizzes]
      operationId: getApiV1QuizzesQuizId
      summary: Quiz take payload (no correct answers)
      security:
        - bearerAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Quiz for taking
          content:
            application/json:
