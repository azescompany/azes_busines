          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPair'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '401':
          description: Token revoked or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '403':
          description: Account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the client may retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: postApiV1AuthLogout
      summary: Revoke refresh session (refresh body or Bearer access)
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogoutRequest'
      responses:
        '200':
          description: Logout acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLogoutResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /api/v1/menus:
    get:
      tags: [menus]
      operationId: getApiV1Menus
      summary: List Admin menu catalog (superAdmin)
      security:
        - bearerAuth: []
      parameters:
        - name: app
          in: query
          schema:
            type: string
            default: admin
      responses:
        '200':
          description: Menu catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuListResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /api/v1/roles:
    get:
      tags: [menus]
      operationId: getApiV1Roles
      summary: List assignable LMS roles for menu binding
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Role list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /api/v1/roles/{role}/menus:
    get:
      tags: [menus]
      operationId: getApiV1RolesRoleMenus
      summary: List menu ids bound to a role
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Role menu binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleMenusResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
    put:
      tags: [menus]
      operationId: putApiV1RolesRoleMenus
      summary: Replace menu ids bound to a role (not superAdmin)
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutRoleMenusRequest'
      responses:
        '200':
          description: Updated binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleMenusResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthLoginRequest:
      type: object
      required: [username, password, deviceId, userAgent, platform, language]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        deviceId:
          type: string
          minLength: 1
        userAgent:
          type: string
          minLength: 1
        platform:
          type: string
          minLength: 1
        language:
          type: string
          minLength: 1
    AuthRefreshRequest:
      type: object
      required: [refreshToken, deviceId]
      properties:
        refreshToken:
          type: string
          minLength: 1
        deviceId:
          type: string
          minLength: 1
    AuthLogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
    AuthTokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 900
        tokenType:
          type: string
          enum: [Bearer]
    AuthLogoutResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
    AuthNavItem:
      type: object
      required: [id, path, i18nKey]
      properties:
        id:
          type: string
          description: Stable nav identity (e.g. home, organizations)
        path:
          type: string
          description: Locale-free Admin path (e.g. /organizations)
        i18nKey:
          type: string
          description: Admin i18n key (e.g. nav.organizations)
        iconKey:
          type: string
          nullable: true
          description: Optional icon map key (home, business, people, security)
    AuthMeResponse:
      type: object
      required: [userId, username, roles, role, orgId, permissions, nav, activeTracks, status]
      properties:
        userId:
          type: string
        username:
          type: string
        roles:
          type: array
          items:
            type: string
        role:
          type: string
          description: Primary role (highest privilege)
        orgId:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            type: string
        nav:
          type: array
          description: Role-filtered Academy primary navigation
          items:
            $ref: '#/components/schemas/AuthNavItem'
        activeTracks:
          type: array
          items:
            type: object
            required: [id, name, slug]
            properties:
              id:
                type: string
              name:
                type: string
              slug:
                type: string
        status:
          type: string
          enum: [active, disabled, pending]
    Organization:
      type: object
      required: [id, name, slug, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active, disabled]
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: integer
        updatedAt:
          type: integer
        orgAdminCount:
          type: integer
        memberCount:
          type: integer
    MeOrganization:
      type: object
      required: [orgId, name, slug, status, role, membershipStatus, isActive]
      properties:
        orgId:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active, disabled]
        role:
          type: string
          enum: [orgAdmin, instructor, student, guest]
        membershipStatus:
          type: string
          enum: [active, disabled, revoked]
        isActive:
          type: boolean
    OrgMembership:
      type: object
      required:
        - id
        - orgId
        - orgName
        - orgSlug
        - orgStatus
        - userId
        - username
        - role
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        orgId:
          type: string
        orgName:
          type: string
        orgSlug:
          type: string
        orgStatus:
          type: string
          enum: [active, disabled]
        userId:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [orgAdmin, instructor, student, guest]
        status:
          type: string
          enum: [active, disabled, revoked]
        createdAt:
          type: integer
        updatedAt:
          type: integer
    OrgInvitation:
      type: object
      required:
        - id
        - orgId
        - email
        - role
        - status
        - expiresAt
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        orgId:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [orgAdmin, instructor, student]
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        expiresAt:
          type: integer
        acceptedAt:
          type: integer
          nullable: true
        createdBy:
          type: string
        createdAt:
          type: integer
        updatedAt:
          type: integer
    OrgInvitationCreated:
      allOf:
        - $ref: '#/components/schemas/OrgInvitation'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Plaintext invite token — returned once
    ActiveOrganizationResponse:
      allOf:
        - $ref: '#/components/schemas/AuthTokenPair'
